name: PR Coverage on Label

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run-tests-and-coverage:
    if: |
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'run_ci') &&
      github.event.pull_request.head.repo.full_name == github.repository
    
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      # ----------------------- Checkout ----------------------- #
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      # ----------------------- Setup Latest Stable Xcode ----------------------- #
      - name: Setup Latest Stable Xcode
        run: |
          echo "🔍 Finding latest stable Xcode..."
          
          LATEST_XCODE=$(ls /Applications | \
            grep "Xcode" | \
            grep -v -i "beta" | \
            grep -v -i "RC" | \
            grep -v -i "preview" | \
            grep -v -i "GM_seed" | \
            sort -V | \
            tail -1)
          
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "/Applications/${LATEST_XCODE}/Contents/Developer"
            echo "✅ Using ${LATEST_XCODE}"
          else
            echo "⚠️ No stable Xcode found, using system default"
          fi
          
          xcodebuild -version

      # ----------------------- Setup Python ----------------------- #
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ----------------------- Install PyYAML ----------------------- #
      - name: Install PyYAML
        run: pip install pyyaml

      # ----------------------- Find or Create Simulator ----------------------- #
      - name: Find Available Simulator
        id: simulator
        run: |
          set -e
          
          echo "🔍 Finding available iOS runtime..."
          RUNTIME=$(xcrun simctl list runtimes iOS -j | \
            jq -r '.runtimes | sort_by(.version) | last | .identifier')
          
          echo "📱 Runtime: $RUNTIME"
          
          echo "🔍 Looking for existing iPhone simulator..."
          DEVICE_UDID=$(xcrun simctl list devices -j | \
            jq -r --arg runtime "$RUNTIME" \
            '.devices[$runtime] // [] | 
             map(select(.name | contains("iPhone"))) | 
             .[0].udid // empty')
          
          if [ -z "$DEVICE_UDID" ]; then
            echo "📱 Creating new simulator..."
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | \
              jq -r '.devicetypes | map(select(.name | contains("iPhone"))) | last | .identifier')
            DEVICE_UDID=$(xcrun simctl create "CI-iPhone" "$DEVICE_TYPE" "$RUNTIME")
            echo "✅ Created simulator: $DEVICE_UDID"
          else
            echo "✅ Found existing simulator: $DEVICE_UDID"
          fi
          
          echo "🚀 Booting simulator..."
          xcrun simctl boot "$DEVICE_UDID" || echo "Simulator already booted"
          
          echo "DEVICE_UDID=$DEVICE_UDID" >> $GITHUB_OUTPUT

      # ----------------------- Run All Module Tests ----------------------- #
      - name: Run All Module Tests
        id: run_tests
        continue-on-error: true
        env:
          SCHEME: "GithubActions"
          DEVICE_UDID: ${{ steps.simulator.outputs.DEVICE_UDID }}
        run: |
          set +e
          
          START_TIME=$(date +%s)
          
          xcodebuild test \
            -workspace GithubActions.xcworkspace \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -skip-testing:GithubActionsUITests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee test_output.log
          
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          echo "TEST_DURATION=${DURATION}s" >> $GITHUB_OUTPUT
          
          exit $TEST_EXIT_CODE

      # ----------------------- Extract Failed Test Details ----------------------- #
      - name: Extract Failed Test Details
        id: test_results
        if: always()
        run: |
          if [ ! -d "TestResults.xcresult" ]; then
            echo "⚠️ No test results found"
            echo "TESTS_RAN=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "TESTS_RAN=true" >> $GITHUB_OUTPUT
          
          if [ "${{ steps.run_tests.outputs.TEST_EXIT_CODE }}" != "0" ]; then
            echo "📊 Extracting failed test details from output..."
            
            cat > extract_failures.py << 'EOF'
          import re
          import json
          
          failures = []
          
          try:
              with open('test_output.log', 'r') as f:
                  log_content = f.read()
              
              # Pattern to match test failures
              # Example: Test Case '-[ModuleTests.TestClass testMethod]' failed
              failure_pattern = r"Test Case '-\[([^\]]+)\]' failed.*?\n(.*?)(?=Test Case|$)"
              
              matches = re.finditer(failure_pattern, log_content, re.DOTALL)
              
              for match in matches:
                  test_name = match.group(1)
                  context = match.group(2)[:500]  # First 500 chars of context
                  
                  # Try to extract assertion failure message
                  assertion_match = re.search(r'failed: (.+)', context)
                  if assertion_match:
                      reason = assertion_match.group(1).strip()
                  else:
                      # Try to find XCTAssert messages
                      assert_match = re.search(r'XCTAssert[^:]+: (.+)', context)
                      if assert_match:
                          reason = assert_match.group(1).strip()
                      else:
                          reason = "Test failed - check logs for details"
                  
                  failures.append({
                      'name': test_name,
                      'reason': reason[:200]  # Limit reason length
                  })
              
              # Remove duplicates
              unique_failures = []
              seen = set()
              for f in failures:
                  if f['name'] not in seen:
                      unique_failures.append(f)
                      seen.add(f['name'])
              
              with open('failed_tests.json', 'w') as f:
                  json.dump(unique_failures, f, indent=2)
              
              if unique_failures:
                  print(f"❌ Found {len(unique_failures)} failed test(s)")
                  print("HAS_FAILURES=true")
              else:
                  print("✅ No test failures extracted")
                  print("HAS_FAILURES=false")
          
          except Exception as e:
              print(f"⚠️ Error extracting failures: {e}")
              print("HAS_FAILURES=false")
              with open('failed_tests.json', 'w') as f:
                  json.dump([], f)
          EOF
            
            python3 extract_failures.py >> $GITHUB_OUTPUT
          else
            echo "HAS_FAILURES=false" >> $GITHUB_OUTPUT
          fi

      # ----------------------- Generate Project-Wide Coverage Report ----------------------- #
      - name: Generate Project-Wide Coverage Report
        if: always() && steps.test_results.outputs.TESTS_RAN == 'true'
        run: |
          set -e
          
          echo "📊 Generating coverage report..."
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          
          cat > convert_coverage.py << 'EOF'
          import json
          
          with open('coverage.json', 'r') as f:
              coverage_data = json.load(f)
          
          with open('coverage.lcov', 'w') as lcov:
              for target in coverage_data.get('targets', []):
                  for file_data in target.get('files', []):
                      file_path = file_data.get('path', '')
                      lcov.write(f"SF:{file_path}\n")
                      
                      for func in file_data.get('functions', []):
                          func_name = func.get('name', '')
                          exec_count = func.get('executionCount', 0)
                          line_number = func.get('lineNumber', 0)
                          lcov.write(f"FN:{line_number},{func_name}\n")
                          lcov.write(f"FNDA:{exec_count},{func_name}\n")
                      
                      lines_data = {}
                      executable_lines = file_data.get('executableLines', 0)
                      line_coverage = file_data.get('lineCoverage', 0.0)
                      
                      if executable_lines > 0:
                          covered_lines = int(executable_lines * line_coverage)
                          for i in range(1, executable_lines + 1):
                              hit_count = 1 if i <= covered_lines else 0
                              lcov.write(f"DA:{i},{hit_count}\n")
                      
                      lcov.write(f"LF:{executable_lines}\n")
                      lcov.write(f"LH:{int(executable_lines * line_coverage)}\n")
                      lcov.write("end_of_record\n")
          
          print("✅ Converted coverage to LCOV format")
          EOF
          
          python3 convert_coverage.py

      # ----------------------- Filter Coverage using .xcodecov.yaml ----------------------- #
      - name: Filter Coverage using .xcodecov.yaml
        if: always() && steps.test_results.outputs.TESTS_RAN == 'true'
        run: |
          set -e
          
          if [ ! -f "ci_scripts/scripts/.xcodecov.yaml" ]; then
            echo "⚠️ .xcodecov.yaml not found, using unfiltered coverage"
            cp coverage.lcov coverage_filtered.lcov
            exit 0
          fi
          
          cat > filter_coverage.py << 'EOF'
          import yaml
          import fnmatch
          import os
          
          with open('ci_scripts/scripts/.xcodecov.yaml', 'r') as f:
              config = yaml.safe_load(f)
          
          ignore_patterns = config.get('ignore', [])
          print(f"📋 Loaded {len(ignore_patterns)} ignore patterns")
          
          with open('coverage.lcov', 'r') as f:
              lcov_lines = f.readlines()
          
          filtered_lines = []
          current_file = None
          skip_current = False
          
          for line in lcov_lines:
              if line.startswith('SF:'):
                  current_file = line[3:].strip()
                  
                  if '/Pods/' in current_file:
                      skip_current = True
                      continue
                  
                  skip_current = False
                  file_basename = os.path.basename(current_file)
                  
                  for pattern in ignore_patterns:
                      if fnmatch.fnmatch(current_file, pattern):
                          skip_current = True
                          break
                      if fnmatch.fnmatch(file_basename, pattern):
                          skip_current = True
                          break
                      if pattern.startswith('**/'):
                          simple_pattern = pattern[3:]
                          if fnmatch.fnmatch(file_basename, simple_pattern):
                              skip_current = True
                              break
                  
                  if not skip_current:
                      filtered_lines.append(line)
              elif not skip_current:
                  filtered_lines.append(line)
          
          with open('coverage_filtered.lcov', 'w') as f:
              f.writelines(filtered_lines)
          
          print(f"✅ Filtered coverage: {len([l for l in lcov_lines if l.startswith('SF:')])} → {len([l for l in filtered_lines if l.startswith('SF:')])} files")
          EOF
          
          python3 filter_coverage.py

      # ----------------------- Calculate Final Coverage ----------------------- #
      - name: Calculate Final Coverage
        id: coverage
        if: always() && steps.test_results.outputs.TESTS_RAN == 'true'
        run: |
          set -e
          
          if [ ! -f "coverage_filtered.lcov" ]; then
            echo "❌ coverage_filtered.lcov not found"
            echo "SUCCESS=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          LH=$(grep "^LH:" coverage_filtered.lcov | awk -F: '{sum+=$2} END {print sum+0}')
          LF=$(grep "^LF:" coverage_filtered.lcov | awk -F: '{sum+=$2} END {print sum+0}')
          FILES=$(grep -c "^SF:" coverage_filtered.lcov || echo "0")
          
          echo "📊 Coverage Stats:"
          echo "  Files: $FILES"
          echo "  Lines Hit: $LH"
          echo "  Lines Total: $LF"
          
          if [ "$LF" -gt 0 ]; then
            COVERAGE=$(awk "BEGIN {printf \"%.2f\", ($LH/$LF)*100}")
            echo "TOTAL_COVERAGE=${COVERAGE}" >> $GITHUB_OUTPUT
            echo "FILES_ANALYZED=$FILES" >> $GITHUB_OUTPUT
            echo "LINES_HIT=$LH" >> $GITHUB_OUTPUT
            echo "LINES_TOTAL=$LF" >> $GITHUB_OUTPUT
            echo "SUCCESS=true" >> $GITHUB_OUTPUT
            echo "✅ Total Coverage: ${COVERAGE}%"
          else
            echo "TOTAL_COVERAGE=0" >> $GITHUB_OUTPUT
            echo "SUCCESS=false" >> $GITHUB_OUTPUT
          fi

      # ----------------------- Comment on PR - Tests Passed ----------------------- #
      - name: Comment on PR - Tests Passed
        if: steps.coverage.outputs.SUCCESS == 'true' && steps.run_tests.outputs.TEST_EXIT_CODE == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.TOTAL_COVERAGE }}';
            const filesAnalyzed = '${{ steps.coverage.outputs.FILES_ANALYZED }}';
            const linesHit = '${{ steps.coverage.outputs.LINES_HIT }}';
            const linesTotal = '${{ steps.coverage.outputs.LINES_TOTAL }}';
            
            const body = `### ✅ Tests Passed
            
            **Test Coverage: ${coverage}%**
            
            📊 Coverage Details:
            - Files Analyzed: ${filesAnalyzed}
            - Lines Covered: ${linesHit}/${linesTotal}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      # ----------------------- Comment on PR - Tests Failed ----------------------- #
      - name: Comment on PR - Tests Failed
        if: steps.run_tests.outputs.TEST_EXIT_CODE != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            let body = '### ❌ Tests Failed\n\n';
            
            if (fs.existsSync('failed_tests.json')) {
              const failures = JSON.parse(fs.readFileSync('failed_tests.json', 'utf8'));
              
              if (failures.length > 0) {
                body += '#### Failed Tests:\n\n';
                const displayCount = Math.min(failures.length, 10);
                
                for (let i = 0; i < displayCount; i++) {
                  const test = failures[i];
                  body += `**${i + 1}. ${test.name}**\n`;
                  body += `   Reason: ${test.reason}\n\n`;
                }
                
                if (failures.length > 10) {
                  body += `_... and ${failures.length - 10} more failures_\n\n`;
                }
              }
            }
            
            const coverage = '${{ steps.coverage.outputs.TOTAL_COVERAGE }}';
            if (coverage && coverage !== '0') {
              body += `\n📊 **Coverage: ${coverage}%**\n\n`;
            }
            
            body += `[View Full Logs](${runUrl})`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      # ----------------------- Fail Workflow if Tests Failed ----------------------- #
      - name: Fail Workflow if Tests Failed
        if: steps.run_tests.outputs.TEST_EXIT_CODE != '0'
        run: |
          echo "❌ Tests failed with exit code ${{ steps.run_tests.outputs.TEST_EXIT_CODE }}"
          exit 1
